  <text x="390" y="416" text-anchor="middle" fill="#8b949e" font-size="10">/backtest   /portfolio</text>
  <text x="390" y="434" text-anchor="middle" fill="#8b949e" font-size="10">/metrics, Prometheus scrape</text>
