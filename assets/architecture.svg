  <text x="360" y="56" text-anchor="middle" fill="#8b949e" font-size="10">yfinance, no API key required</text>

  <line x1="300" y1="66" x2="230" y2="100" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrow)"/>
