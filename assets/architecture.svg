<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" font-family="Inter, Arial, sans-serif">
  <rect width="720" height="560" fill="#0a0f1a"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/>
    </marker>
  </defs>

  <rect x="220" y="16" width="280" height="50" rx="8" fill="#111827" stroke="#30363d" stroke-width="1.5"/>
