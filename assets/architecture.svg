  <rect x="340" y="182" width="100" height="44" rx="8" fill="#111827" stroke="#30363d" stroke-width="1.5"/>
  <text x="390" y="209" text-anchor="middle" fill="#e6edf3" font-size="12" font-weight="700">MLflow</text>

  <rect x="460" y="182" width="150" height="44" rx="8" fill="#111827" stroke="#30363d" stroke-width="1.5"/>
  <text x="535" y="209" text-anchor="middle" fill="#e6edf3" font-size="12" font-weight="700">MinIO</text>

  <line x1="390" y1="226" x2="390" y2="258" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="230" y="260" width="320" height="60" rx="8" fill="#111827" stroke="#f59e0b" stroke-width="1.5"/>
