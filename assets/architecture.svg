  <line x1="360" y1="125" x2="400" y2="125" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="402" y="102" width="260" height="46" rx="8" fill="#111827" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="532" y="130" text-anchor="middle" fill="#fdba74" font-size="12" font-weight="700">PySpark feature engineering</text>

  <line x1="230" y1="148" x2="230" y2="180" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="360" y1="148" x2="360" y2="180" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="500" y1="148" x2="500" y2="180" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrow)"/>

