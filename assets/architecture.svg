  <text x="390" y="524" text-anchor="middle" fill="#e6edf3" font-size="12" font-weight="700">React Dashboard</text>
  <text x="390" y="540" text-anchor="middle" fill="#8b949e" font-size="9">6 tabs, port 3012</text>
