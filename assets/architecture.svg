  <line x1="420" y1="66" x2="490" y2="100" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="500" y="86" text-anchor="middle" fill="#64748b" font-size="9">News, VADER sentiment</text>

  <rect x="100" y="102" width="260" height="46" rx="8" fill="#111827" stroke="#f59e0b" stroke-width="1.5"/>
