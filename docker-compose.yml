# ChronoFin — Root-level docker-compose
# This file delegates to docker/docker-compose.yml
# Usage: docker compose up -d
# All services start from the docker/ subdirectory where Dockerfiles live.

# To start infrastructure only (no build required):
#   docker compose -f docker/docker-compose.yml up -d postgres redis kafka minio mlflow
#
# To start all services:
#   docker compose -f docker/docker-compose.yml up -d
#
# Access points:
#   FastAPI:          http://localhost:8000/docs
#   Streamlit:        http://localhost:8501
#   Airflow:          http://localhost:8080  (admin/admin)
#   MLflow:           http://localhost:5000
#   MinIO Console:    http://localhost:9001  (minioadmin/minioadmin)


# Shared Airflow config
x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: docker/Dockerfile.airflow
  environment:
    AIRFLOW__CORE__EXECUTOR: CeleryExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow:airflow@postgres/airflow
    AIRFLOW__CELERY__BROKER_URL: redis://redis:6379/0
    AIRFLOW__CORE__FERNET_KEY: "${AIRFLOW_FERNET_KEY:-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__WEBSERVER__SECRET_KEY: "${AIRFLOW__CORE__SECRET_KEY:-chronofin_secret}"
    AIRFLOW__API__AUTH_BACKENDS: "airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session"
    AIRFLOW__LOGGING__LOG_LEVEL: INFO
    ALPHA_VANTAGE_KEY: "${ALPHA_VANTAGE_KEY:-demo}"
    POSTGRES_URL: "postgresql://airflow:airflow@postgres/stockai"
    REDIS_URL: "redis://redis:6379"
    KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
    MODEL_DIR: /opt/airflow/models
    PROCESSED_PATH: /opt/airflow/data/processed
    MLFLOW_TRACKING_URI: "http://mlflow:5000"
  volumes:
    - airflow_logs:/opt/airflow/logs
    - airflow_data:/opt/airflow/data
    - airflow_models:/opt/airflow/models
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:

  # Infrastructure
  postgres:
    container_name: chronofin-postgres
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./configs/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"

  redis:
    container_name: chronofin-redis
    image: redis:7-alpine
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "6382:6379"

  zookeeper:
    container_name: chronofin-zookeeper
    image: confluentinc/cp-zookeeper:7.5.3
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data

  kafka:
    container_name: chronofin-kafka
    image: confluentinc/cp-kafka:7.5.3
    depends_on: [zookeeper]
    ports:
      - "9095:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9095
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data

  minio:
    container_name: chronofin-minio
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9002:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  mlflow:
    container_name: chronofin-mlflow
    image: ghcr.io/mlflow/mlflow:v2.9.2
    ports:
      - "5000:5000"
    command: >
      mlflow server
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
      --host 0.0.0.0
      --port 5000
    volumes:
      - mlflow_artifacts:/mlflow/artifacts
    depends_on:
      postgres:
        condition: service_healthy

  # Airflow
  airflow-init:
    <<: *airflow-common
    container_name: chronofin-airflow-init
    command: >
      bash -c "
        airflow db migrate &&
        airflow users create
          --username admin --password admin
          --firstname Admin --lastname User
          --role Admin --email admin@chronofin.ai
      "
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    container_name: chronofin-airflow-webserver
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    container_name: chronofin-airflow-scheduler
    command: scheduler
    restart: unless-stopped

  airflow-worker:
    <<: *airflow-common
    container_name: chronofin-airflow-worker
    command: celery worker
    restart: unless-stopped

  airflow-flower:
    <<: *airflow-common
    container_name: chronofin-airflow-flower
    command: celery flower
    ports:
      - "5555:5555"
    restart: unless-stopped

  # Application services
  chronofin-api:
    container_name: chronofin-api
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      POSTGRES_URL: "postgresql://airflow:airflow@postgres/stockai"
      REDIS_URL: "redis://redis:6379"
      MODEL_DIR: /app/models
      PROCESSED_PATH: /app/data/processed
      MLFLOW_TRACKING_URI: "http://mlflow:5000"
      ALPHA_VANTAGE_KEY: "${ALPHA_VANTAGE_KEY:-demo}"
    volumes:
      - api_data:/app/data
      - api_models:/app/models
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  dashboard:
    container_name: chronofin-dashboard
    build:
      context: .
      dockerfile: docker/Dockerfile.dashboard
    ports:
      - "8501:8501"
    environment:
      API_BASE_URL: "http://chronofin-api:8000/api/v1"
    depends_on:
      - chronofin-api
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  chronofin-ui:
    container_name: chronofin-ui
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3012:80"
    depends_on:
      - chronofin-api
    restart: unless-stopped

  prometheus:
    container_name: chronofin-prometheus2
    image: prom/prometheus:v2.51.0
    ports:
      - "9090:9090"
    volumes:
      - ./configs/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=7d'
    restart: unless-stopped

  grafana:
    container_name: chronofin-grafana2
    image: grafana/grafana:10.4.2
    ports:
      - "3002:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
  kafka_data:
  zookeeper_data:
  mlflow_artifacts:
  airflow_logs:
  airflow_data:
  airflow_models:
  api_data:
  api_models:
  prometheus_data:
  grafana_data:

networks:
  default:
    name: chronofin_network
